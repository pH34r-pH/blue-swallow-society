<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blue Swallow</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/main.js"></script>
</head>
<body data-mode="login">
  <main class="terminal-screen active" aria-labelledby="loginTitle">
    <section class="terminal-container">
      <div class="terminal-panel panel login-panel">
        <h1 id="loginTitle" class="terminal-title">Blue Swallow</h1>
        <p>Personal sensing companion</p>
        <p id="authStatus" role="status" aria-live="polite">Checking your session…</p>
        <button id="signInBtn" class="btn login-btn" type="button">Sign in with Microsoft</button>
      </div>
    </section>
  </main>
</body>
</html>
