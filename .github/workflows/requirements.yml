name: Requirements contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  requirements:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pH34r-pH/long-haul/.github/actions/requirements@9cf47e69ff0e40530082d5d6868eb37fc22998ae
        with:
          output: ${{ runner.temp }}/requirements.json
