name: Prototype / devenv

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'devenv.nix'
      - 'devenv.yaml'
      - 'devenv.lock'
      - '.github/workflows/prototype-devenv.yml'
      - 'api/**'
      - 'vm/cybermap-api/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Exercise Node 24 + PostGIS environment
        run: devenv test
      - name: Build the existing Functions app on Microsoft's Node 24 base
        run: |
          set -euo pipefail
          docker build -f api/Dockerfile.prototype -t society-functions-prototype .
          docker run --rm --entrypoint node society-functions-prototype --version | grep -E '^v24\.'
