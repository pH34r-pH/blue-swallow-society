name: Structural quality audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Native + Lizard + jscpd
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python audit tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.9" "lizard==1.24.0"

      - name: Native JavaScript structural lint (audit only)
        shell: bash
        run: |
          set +e
          mkdir -p quality-audit
          npx --yes eslint@9.38.0 app api vm scripts tests \
            --no-config-lookup --ext .js,.mjs,.cjs \
            --ignore-pattern 'api/_private/operator/assets/maplibre-gl*.mjs' \
            --rule 'max-lines: ["warn", {"max": 500, "skipBlankLines": true, "skipComments": true}]' \
            --rule 'max-lines-per-function: ["warn", {"max": 75, "skipBlankLines": true, "skipComments": true}]' \
            --rule 'complexity: ["warn", 15]' \
            --rule 'max-params: ["warn", 7]' \
            --rule 'max-depth: ["warn", 4]' \
            > quality-audit/eslint-structural.txt 2>&1
          status=$?
          cat quality-audit/eslint-structural.txt
          echo "eslint_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Native Python structural lint (audit only)
        shell: bash
        run: |
          set +e
          ruff check . \
            --select C901,PLR0912,PLR0913,PLR0915 \
            --config "lint.mccabe.max-complexity=15" \
            --config "lint.pylint.max-args=7" \
            --output-format concise > quality-audit/ruff-structural.txt 2>&1
          status=$?
          cat quality-audit/ruff-structural.txt
          echo "ruff_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Lizard structural metrics (audit only)
        shell: bash
        run: |
          set +e
          lizard app api vm scripts tests -C 15 -L 75 -a 7 -w \
            -x "*/node_modules/*" -x "*/dist/*" -x "*/build/*" \
            -x "api/_private/operator/assets/maplibre-gl*.mjs" \
            > quality-audit/lizard.txt 2>&1
          status=$?
          cat quality-audit/lizard.txt
          echo "lizard_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Classify structural findings
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path("quality-audit/lizard.txt").read_text(errors="replace") if Path("quality-audit/lizard.txt").exists() else ""
          warning_lines = [line for line in text.splitlines() if "warning:" in line and " NLOC," in line]
          categories = [
            ("tests", r"^((\./)?tests/|.*\/test/)"),
            ("orchestration", r"^((\./)?scripts/|.*\/scripts/)"),
            ("production-app", r"^((\./)?app/|(\./)?api/|.*\/src/)"),
          ]
          counts = {name: 0 for name, _ in categories}
          unmatched = 0
          for line in warning_lines:
              path_match = re.search(r"(?:Z )?(?:\./)?([^:]+):\d+: warning:", line)
              path = path_match.group(1) if path_match else line
              matched = False
              probe = "./" + path.lstrip("./")
              for name, pattern in categories:
                  if re.search(pattern, probe) or re.search(pattern, path):
                      counts[name] += 1
                      matched = True
                      break
              if not matched:
                  unmatched += 1
          with open(Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]), "a", encoding="utf-8") as out:
              out.write("\n### Structural findings by scope\n\n")
              for name, _ in categories:
                  out.write(f"- {name}: {counts[name]}\n")
              out.write(f"- other/unclassified: {unmatched}\n")
              out.write(f"- total: {len(warning_lines)}\n")
          PY

      - name: Copy/paste duplication audit (audit only)
        shell: bash
        run: |
          set +e
          npx --yes jscpd@5.0.12 app api vm scripts tests \
            --min-lines 8 --min-tokens 60 \
            --format python,javascript,typescript \
            --ignore "**/node_modules/**,**/dist/**,**/build/**,**/*-lock.json,**/api/_private/operator/assets/maplibre-gl*.mjs" \
            --reporters console,json --output quality-audit/jscpd \
            > quality-audit/jscpd-console.txt 2>&1
          status=$?
          cat quality-audit/jscpd-console.txt
          echo "jscpd_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-quality-audit-${{ github.sha }}
          path: quality-audit/
          if-no-files-found: warn
          retention-days: 14
