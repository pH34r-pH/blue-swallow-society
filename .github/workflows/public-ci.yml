name: Society public CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  app-and-functions:
    name: society-app-and-functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            vm/cybermap-api/package-lock.json
      - name: Require the declared Node runtime before installation
        run: node --test tests/node-runtime-contract.test.mjs
      - name: Install Function and shared contract dependencies
        run: |
          npm ci --prefix api --ignore-scripts --engine-strict
          npm ci --prefix vm/cybermap-api --ignore-scripts --engine-strict
      - name: Run app, Function, and source contract tests
        # Three Obscura browser tests require a separate browser CLI that is not
        # available on standard hosted runners; all other root tests run here.
        run: node --test --test-skip-pattern='^Obscura ' tests/*.test.mjs

  companion-browser:
    name: companion-browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --prefix api --ignore-scripts --engine-strict
      - run: npm exec --prefix api -- playwright install --with-deps chromium
      - run: node --test tests/companion.browser.mjs tests/owner-login.browser.mjs tests/travels.browser.mjs

  cybermap-api:
    name: cybermap-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vm/cybermap-api/package-lock.json
      - name: Install Cybermap API dependencies
        run: npm ci --prefix vm/cybermap-api --ignore-scripts --engine-strict
      - name: Run Cybermap API tests
        run: npm test --prefix vm/cybermap-api

  history-postgres:
    name: history-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env:
          POSTGRES_PASSWORD: synthetic-history-only
          POSTGRES_DB: bss_history_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --prefix vm/cybermap-api --ignore-scripts --engine-strict
      - name: Apply existing schema to disposable synthetic database
        env:
          PGPASSWORD: synthetic-history-only
        run: |
          for migration in vm/cybermap-api/db/migrations/*.sql; do
            psql -h 127.0.0.1 -U postgres -d bss_history_synthetic -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Query canonical synthetic history in PostGIS
        env:
          HISTORY_TEST_DATABASE_URL: postgres://postgres:synthetic-history-only@127.0.0.1:5432/bss_history_synthetic
        run: node --test tests/history-postgres.integration.mjs
