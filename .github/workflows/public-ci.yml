name: Society public CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  app-and-functions:
    name: society-app-and-functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            vm/cybermap-api/package-lock.json
      - name: Install Function and shared contract dependencies
        run: |
          npm ci --prefix api --ignore-scripts
          npm ci --prefix vm/cybermap-api --ignore-scripts
      - name: Run app, Function, and source contract tests
        # Three Obscura browser tests require a separate browser CLI that is not
        # available on standard hosted runners; all other root tests run here.
        run: node --test --test-skip-pattern='^Obscura ' tests/*.test.mjs

  cybermap-api:
    name: cybermap-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vm/cybermap-api/package-lock.json
      - name: Install Cybermap API dependencies
        run: npm ci --prefix vm/cybermap-api --ignore-scripts
      - name: Run Cybermap API tests
        run: npm test --prefix vm/cybermap-api
