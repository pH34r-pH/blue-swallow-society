name: Infra What-If (manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-blue-swallow
  LOCATION: westus2

jobs:
  whatif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION"

      - name: Run resource-group what-if
        env:
          SSH_KEY: ${{ secrets.VM_SSH_PUBLIC_KEY }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          BSS_CYBERMAP_READ_TOKEN: ${{ secrets.BSS_CYBERMAP_READ_TOKEN }}
          BSS_PAPER_STATE_TOKEN: ${{ secrets.BSS_PAPER_STATE_TOKEN }}
          BSS_MORNING_BRIEF_TOKEN: ${{ secrets.BSS_MORNING_BRIEF_TOKEN }}
          BSS_MTLS_PROXY_SECRET: ${{ secrets.BSS_MTLS_PROXY_SECRET }}
          BSS_WARDRIVER_MTLS_TRUST_PEM: ${{ secrets.BSS_WARDRIVER_MTLS_TRUST_PEM }}
          BSS_RAID_MODEL_TRUSTED_PUBLIC_KEYS_JSON: ${{ secrets.BSS_RAID_MODEL_TRUSTED_PUBLIC_KEYS_JSON }}
        run: |
          ssh_key=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          postgres_password=$(printf '%s' "$POSTGRES_ADMIN_PASSWORD" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          cybermap_read_token=$(printf '%s' "$BSS_CYBERMAP_READ_TOKEN" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          paper_state_token=$(printf '%s' "$BSS_PAPER_STATE_TOKEN" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          morning_brief_token=$(printf '%s' "$BSS_MORNING_BRIEF_TOKEN" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          mtls_proxy_secret=$(printf '%s' "$BSS_MTLS_PROXY_SECRET" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          mtls_trust_pem=$(printf '%s' "$BSS_WARDRIVER_MTLS_TRUST_PEM" | tr -d '\r')
          raid_model_trusted_public_keys_json=$(printf '%s' "$BSS_RAID_MODEL_TRUSTED_PUBLIC_KEYS_JSON" | tr -d '\r')
          if [ -z "$raid_model_trusted_public_keys_json" ] || [ "$raid_model_trusted_public_keys_json" = '{}' ]; then
            echo "BSS_RAID_MODEL_TRUSTED_PUBLIC_KEYS_JSON must contain at least one approved public key" >&2
            exit 1
          fi
          cybermap_source_url="https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"
          curl --fail --location --silent --show-error "$cybermap_source_url" -o cybermap-source.tar.gz
          cybermap_source_sha256="$(sha256sum cybermap-source.tar.gz | awk '{print $1}')"
          rm -f cybermap-source.tar.gz
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.json \
            --parameters sshPublicKey="$ssh_key" \
            --parameters postgresAdministratorLoginPassword="$postgres_password" \
            --parameters cybermapReadToken="$cybermap_read_token" \
            --parameters paperStateToken="$paper_state_token" \
            --parameters morningBriefToken="$morning_brief_token" \
            --parameters mtlsProxySecret="$mtls_proxy_secret" \
            --parameters wardriverMtlsTrustCertificatePem="$mtls_trust_pem" \
            --parameters raidModelTrustedPublicKeysJson="$raid_model_trusted_public_keys_json" \
            --parameters cybermapSourceRevision="$GITHUB_SHA" \
            --parameters cybermapSourceTarballUrl="$cybermap_source_url" \
            --parameters cybermapSourceTarballSha256="$cybermap_source_sha256"
