name: World browser checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  world-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --prefix api --ignore-scripts --engine-strict
      - run: npm exec --prefix api -- playwright install --with-deps chromium
      - run: node --test tests/world.browser.mjs
