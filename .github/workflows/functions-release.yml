name: Public Functions image

on:
  pull_request:
    paths:
      - 'api/**'
      - 'tests/**'
      - '.nvmrc'
      - '.github/workflows/functions-release.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: public-functions-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/ph34r-ph/blue-swallow-society/functions
  AZURITE_IMAGE: mcr.microsoft.com/azure-storage/azurite:3.37.0

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            vm/cybermap-api/package-lock.json
      - name: Install existing source-test dependencies
        run: |
          npm ci --prefix api --ignore-scripts --engine-strict
          npm ci --prefix vm/cybermap-api --ignore-scripts --engine-strict
      - name: Run the existing Society source tests
        run: node --test --test-skip-pattern='^Obscura ' tests/*.test.mjs
      - name: Build the Node 24 Functions image
        run: |
          set -euo pipefail
          docker build -f api/Dockerfile -t society-functions:test .
          docker run --rm --entrypoint node society-functions:test --version | grep -E '^v24\.'
      - name: Exercise the real Functions HTTP host with Azurite
        run: |
          set -euo pipefail
          network=society-functions-smoke
          account=devstoreaccount1
          key='ZmFrZS1rZXktZm9yLXNvY2lldHktY2ktb25seQ=='
          connection="DefaultEndpointsProtocol=http;AccountName=$account;AccountKey=$key;BlobEndpoint=http://azurite:10000/$account;QueueEndpoint=http://azurite:10001/$account;TableEndpoint=http://azurite:10002/$account;"

          docker network create "$network"
          trap 'docker rm -f society-functions-smoke azurite >/dev/null 2>&1 || true; docker network rm "$network" >/dev/null 2>&1 || true' EXIT

          docker run -d --name azurite --network "$network" \
            -e "AZURITE_ACCOUNTS=$account:$key" \
            "$AZURITE_IMAGE"

          docker run -d --name society-functions-smoke --network "$network" \
            -p 127.0.0.1:8080:80 \
            -e "AzureWebJobsStorage=$connection" \
            society-functions:test

          response="$RUNNER_TEMP/operator-logout.json"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              -X POST http://127.0.0.1:8080/api/operator-logout \
              -o "$response"; then
              break
            fi
            sleep 2
          done
          if ! jq -e '.ok == true' "$response" >/dev/null 2>&1; then
            docker logs society-functions-smoke >&2 || true
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release tag on main history
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            vm/cybermap-api/package-lock.json
      - name: Re-run source tests before publishing
        run: |
          set -euo pipefail
          npm ci --prefix api --ignore-scripts --engine-strict
          npm ci --prefix vm/cybermap-api --ignore-scripts --engine-strict
          node --test --test-skip-pattern='^Obscura ' tests/*.test.mjs
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile an existing public release
        id: existing-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/existing-release.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          case "$status" in
            404)
              version_ref="$IMAGE_NAME:$GITHUB_REF_NAME"
              if docker buildx imagetools inspect "$version_ref" >/dev/null 2>&1; then
                echo "A versioned GHCR image exists without a GitHub Release; refusing to overwrite an unqualified image." >&2
                exit 1
              fi
              echo "release_exists=false" >> "$GITHUB_OUTPUT"
              echo "already_released=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            200) ;;
            *) echo "Release lookup returned HTTP $status; refusing to publish." >&2; exit 1 ;;
          esac

          body="$(jq -r '.body // empty' "$response")"
          mapfile -t digests < <(printf '%s\n' "$body" | grep -oE 'sha256:[0-9a-f]{64}' || true)
          version_ref="$IMAGE_NAME:$GITHUB_REF_NAME"
          if [[ "${#digests[@]}" -eq 1 ]]; then
            recorded_digest="${digests[0]}"
            registry_digest="$(docker buildx imagetools inspect "$version_ref" --format '{{json .Manifest}}' | jq -er '.digest')"
            [[ "$registry_digest" == "$recorded_digest" ]] || {
              echo "Existing release digest does not match the versioned GHCR image; refusing to mutate either." >&2
              exit 1
            }
            gh attestation verify "oci://$IMAGE_NAME@$recorded_digest" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/functions-release.yml"
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "Existing release is complete and matches its immutable GHCR digest and exact source tag; no image tag or attestation will be rewritten." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${#digests[@]}" -eq 0 && "$body" == *"Artifact status: publication pending."* ]]; then
            if docker buildx imagetools inspect "$version_ref" >/dev/null 2>&1; then
              echo "The pending release already has a versioned GHCR image but no completed release digest; refusing to overwrite it." >&2
              exit 1
            fi
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          else
            echo "Existing release is neither a verified release nor an explicitly pending seed release; refusing to publish." >&2
            exit 1
          fi
      - name: Build, smoke, and push the public Functions image
        if: steps.existing-release.outputs.already_released != 'true'
        id: image
        run: |
          set -euo pipefail
          docker build -f api/Dockerfile -t society-functions:test .
          docker run --rm --entrypoint node society-functions:test --version | grep -E '^v24\.'

          network=society-functions-release-smoke
          account=devstoreaccount1
          key='ZmFrZS1rZXktZm9yLXNvY2lldHktY2ktb25seQ=='
          connection="DefaultEndpointsProtocol=http;AccountName=$account;AccountKey=$key;BlobEndpoint=http://azurite:10000/$account;QueueEndpoint=http://azurite:10001/$account;TableEndpoint=http://azurite:10002/$account;"
          docker network create "$network"
          trap 'docker rm -f society-functions-release-smoke azurite-release >/dev/null 2>&1 || true; docker network rm "$network" >/dev/null 2>&1 || true' EXIT
          docker run -d --name azurite-release --network "$network" \
            --network-alias azurite \
            -e "AZURITE_ACCOUNTS=$account:$key" \
            "$AZURITE_IMAGE"
          docker run -d --name society-functions-release-smoke --network "$network" \
            -p 127.0.0.1:8080:80 \
            -e "AzureWebJobsStorage=$connection" \
            society-functions:test

          response="$RUNNER_TEMP/operator-logout.json"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              -X POST http://127.0.0.1:8080/api/operator-logout \
              -o "$response"; then
              break
            fi
            sleep 2
          done
          jq -e '.ok == true' "$response"

          version_ref="$IMAGE_NAME:$GITHUB_REF_NAME"
          docker tag society-functions:test "$version_ref"
          docker push "$version_ref"

          digest="$(docker buildx imagetools inspect "$version_ref" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          latest_ref="$IMAGE_NAME:latest"
          docker tag society-functions:test "$latest_ref"
          docker push "$latest_ref"

          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version_ref=$version_ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Public Society Functions image"
            echo
            echo "- image: `$IMAGE_NAME@$digest`"
            echo "- tag: `$version_ref`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the public OCI digest
        if: steps.existing-release.outputs.already_released != 'true'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Verify public provenance
        if: steps.existing-release.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify \
            "oci://${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}" \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/functions-release.yml"
      - name: Publish normal GitHub release metadata
        if: steps.existing-release.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Public Node 24 Azure Functions image for Blue Swallow Society.

          - OCI image: $IMAGE_NAME@$IMAGE_DIGEST
          - Version tag: $IMAGE_NAME:$GITHUB_REF_NAME
          - Build provenance: $ATTESTATION_URL
          - Functions base: mcr.microsoft.com/azure-functions/node:4-node24

          Private Fleet instances should deploy the immutable Society digest above. Rebuild new Society releases to receive Microsoft's supported Node 24 Functions base-image updates.
          EOF
          if [[ "${{ steps.existing-release.outputs.release_exists }}" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Blue Swallow Society $GITHUB_REF_NAME" \
              --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Blue Swallow Society $GITHUB_REF_NAME" \
              --notes-file "$notes"
          fi
